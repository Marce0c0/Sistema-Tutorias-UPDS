<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de Gestión de Tutorías y Cursos Universitarios - Universidad Privada Domingo Savio (UPDS). Plataforma Full Stack integrada con API REST y PostgreSQL." />
  <meta name="author" content="Universidad Privada Domingo Savio" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#0F2042" />

  <title>Sistema de Tutorías y Cursos | UPDS</title>

  <!-- Tipografía Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Estilos del Sistema de Diseño -->
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>
  <!-- Splash Screen Institucional de Carga Inicial -->
  <div id="app-loading-overlay" class="loading-overlay">
    <div class="loading-splash-card">
      <div class="splash-logo-box">
        <img src="img/upds-logo.png" alt="Universidad Privada Domingo Savio" class="splash-logo-img" />
      </div>
      <div class="splash-loader-bar">
        <div class="splash-loader-fill"></div>
      </div>
      <p class="splash-text">Universidad Privada Domingo Savio</p>
      <p class="splash-subtext">Cargando plataforma institucional...</p>
    </div>
  </div>

  <div id="app" class="app-layout">
    <!-- Barra de Navegación y Encabezado Superior -->
    <div id="navbar-mount"></div>

    <!-- Contenedor Principal de Vistas SPA -->
    <main class="main-container">
      <div id="main-content-mount" class="content-wrapper"></div>
    </main>

    <!-- Pie de Página Institucional -->
    <footer class="app-footer">
      <div class="footer-container">
        <div class="footer-info">
          <strong>Universidad Privada Domingo Savio (UPDS)</strong> — Sistema de Tutorías y Cursos
        </div>
        <div class="footer-author">
          Portal Institucional de Gestión y Asesoría Académica
        </div>
      </div>
    </footer>
  </div>

  <!-- Contenedor de Toasts (Notificaciones Emergentes) -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Módulo Principal de JavaScript ES6 -->
  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
