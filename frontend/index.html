<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de Gestión de Tutorías y Cursos Universitarios - Universidad Privada Domingo Savio (UPDS). Plataforma Full Stack integrada con API REST y PostgreSQL." />
  <meta name="author" content="Sammy Marcelo Sivila Sanchez" />
  <meta name="theme-color" content="#0F2042" />

  <title>Sistema de Tutorías y Cursos | UPDS</title>

  <!-- Tipografía Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Estilos del Sistema de Diseño -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Overlay de Carga Inicial -->
  <div id="app-loading-overlay" class="loading-overlay">
    <div class="loading-spinner-box">
      <div class="spinner"></div>
      <p class="loading-text">Conectando con la API REST UPDS...</p>
    </div>
  </div>

  <div id="app" class="app-layout">
    <!-- Barra de Navegación y Encabezado Superior -->
    <div id="navbar-mount"></div>

    <!-- Contenedor Principal de Vistas SPA -->
    <main class="main-container">
      <div id="main-content-mount" class="content-wrapper"></div>
    </main>

    <!-- Pie de Página Institucional -->
    <footer class="app-footer">
      <div class="footer-container">
        <div class="footer-info">
          <strong>Universidad Privada Domingo Savio (UPDS)</strong> — Sistema de Tutorías y Cursos
        </div>
        <div class="footer-author">
          Desarrollado por: <strong>Sammy Marcelo Sivila Sanchez</strong> · Arquitectura Full Stack
        </div>
      </div>
    </footer>
  </div>

  <!-- Contenedor de Toasts (Notificaciones Emergentes) -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Módulo Principal de JavaScript ES6 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
